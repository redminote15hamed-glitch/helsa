name: helsa
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
  disk_space_plus: ^0.2.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pedometer: ^4.2.0
  # 12.0.1 → android 13.x (بدون v1 embedding و بدون API 37)
  permission_handler: 12.0.1
  flutter_local_notifications: 19.4.2
  flutter_foreground_task: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

# اجبار نسخه میانی: نه 12.0.1 (v1) و نه 14.1.0 (SDK 37)
dependency_overrides:
  permission_handler_android: 13.0.1

flutter:
  uses-material-design: true

  fonts:
    - family: YekanBakh
      fonts:
        - asset: assets/fonts/YekanBakh-Thin.ttf
          weight: 100
        - asset: assets/fonts/YekanBakh-Light.ttf
          weight: 300
        - asset: assets/fonts/YekanBakh-Regular.ttf
          weight: 400
        - asset: assets/fonts/YekanBakh-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/YekanBakh-Bold.ttf
          weight: 700
        - asset: assets/fonts/YekanBakh-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/YekanBakh-Black.ttf
          weight: 900
        - asset: assets/fonts/YekanBakh-ExtraBlack.ttf
          weight: 900

    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Thin.ttf
          weight: 100
        - asset: assets/fonts/Vazirmatn-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Vazirmatn-Light.ttf
          weight: 300
        - asset: assets/fonts/Vazirmatn-Regular.ttf
          weight: 400
        - asset: assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
        - asset: assets/fonts/Vazirmatn-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Vazirmatn-Black.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/helsa_icon.png"
  adaptive_icon_background: "#00BFA5"
  adaptive_icon_foreground: "assets/icon/helsa_icon.png"
